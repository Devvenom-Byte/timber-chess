function capturedInfo(board){
  const init={p:8,n:2,b:2,r:2,q:1}, val={p:1,n:3,b:3,r:5,q:9}; const cnt={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}}; let mat={w:0,b:0};
  for(const p of board){ if(!p) continue; const c=colorOf(p), t=p.toLowerCase(); if(t!=='k'){ cnt[c][t]++; mat[c]+=val[t]; } }
  const lost={w:[],b:[]};
  for(const c of 'wb') for(const t of 'qrbnp'){ const n=Math.max(0,init[t]-cnt[c][t]); for(let i=0;i<n;i++) lost[c].push(t); }
  return {lost,diff:mat.w-mat.b};
}
function stripHTML(color,name,sub,avatar,{turn,thinking,online,lvl,nocaps,clock}={}){
  const {board}=displayed(); const ci=capturedInfo(board);
  const opp=color==='w'?'b':'w';
  const caps=ci.lost[opp].map(t=>`<img src="${IMG[opp+t.toUpperCase()]}" alt="">`).join('');
  const adv=color==='w'?ci.diff:-ci.diff;
  return `<div class="av${turn?' turn':''}">${avatar}</div><div style="min-width:0"><div class="pname">${esc(name)}${online!==undefined?`<span class="online-dot${online?' on':''}"></span>`:''}${thinking?'<span class="thinking"><i></i><i></i><i></i></span>':''}</div>${sub?`<div class="psub">${esc(sub)}</div>`:''}</div>${lvl?'<button class="lvchip" data-act="level" aria-label="Change computer level">Level ▾</button>':''}${nocaps?'':`<div class="caps">${caps}${adv>0?`<span class="adv">+${adv}</span>`:''}</div>`}${clock?`<span class="clock" data-clock="${color}" role="timer" aria-label="${color==='w'?'White':'Black'} clock"></span>`:''}`;
}

    case 'fgstart': fgGoto(s,0); break;
    case 'fgguess': s.guess=!s.guess; store.set('fgGuess',s.guess); if(s.checking){ renderAll(); break; } if(!s.guess){ s.awaitGuess=false; s.msg=''; } else fgPrompt(s); S.hint=null; renderAll(); break;
    case 'lsretry': startLesson(s.les); break;
    case 'lsnext': { const i=s.les?LESSONS.indexOf(s.les):-1; startLesson(LESSONS.find((l,k)=>k>i&&!learnDone[l.id])||LESSONS[(i+1)%LESSONS.length]); break; }
    case 'lsplay': startPlay('cpu','w',0,'off'); toast('Your first game against Twig. Good luck!'); break;
    case 'lobby': openLobby(); break;
    case 'famjoin': openJoin(); break;
    case 'tabplay': switchTab('play'); break;
    case 'resign': confirmSheet('Resign this game?','Your opponent will be told you resigned.','Resign',()=>Fam.resign()); break;
    case 'draw': Fam.offerDraw(); break;
    case 'famcancel': Fam.cancel(); break;
  }
});

const fold=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,'');
function scoreText(fields,q){ // fields: [[text,weight],...]; every word of the query must appear somewhere
  const words=fold(q).split(/\s+/).filter(Boolean); if(!words.length) return 0;
  let total=0;
  for(const w of words){ let best=0;
    for(const [t,wt] of fields){ const f=fold(t); const i=f.indexOf(w); if(i<0) continue; const atWord=i===0||/[^a-z0-9]/.test(f[i-1]); best=Math.max(best,wt*(i===0?3:atWord?2:1)); }
    if(!best) return 0; total+=best; }
  return total;
}
function bookScore(b,q){
  const mv=movesText(b.sans), q2=q.replace(/^1\.\s*/,'');
  return scoreText([[b.name,5],[b.eco,4],[b.sans.join(' '),3],[mv,3],[b.sum,1],[b.players,1],[b.ideas.join(' '),.5]],q2);
}

/* ================= game review ================= */
// After a game, the engine looks at every position. For each move we compare how good the position was before
// and after it (as a winning chance, 0-100%), name the move (Best ... Blunder) and explain it in plain words.
const RV_NAME={book:'Book',best:'Best',excellent:'Excellent',good:'Good',inacc:'Small slip',mistake:'Mistake',blunder:'Blunder'};
const PIECE_WORD={p:'pawn',n:'knight',b:'vizier',r:'rook',q:'queen',k:'king'};
const RV_MATE=100000;
const rvKey=s=>s.game.start+'|'+s.game.moves.join(' ');

const rvCp=sc=>sc>RV_MATE-1000?3000-(RV_MATE-sc):sc<-RV_MATE+1000?-3000+(RV_MATE+sc):clamp(sc,-2500,2500);
const rvWin=sc=>50+50*(2/(1+Math.exp(-0.00368208*rvCp(sc)))-1);
const rvMateIn=sc=>Math.ceil((RV_MATE-Math.abs(sc))/2);
function rvSide(s,c){
  if(s===sessions.play&&s.kind==='cpu') return c===s.human?'You':LEVELS[s.level].name;
  if(s===sessions.family&&s.gid) return Fam.nm(Fam.player(c));
  return c==='w'?'White':'Black';

function rvMover(s,i){ const b=s.game.start.split(' ')[1]==='b'; return ((i%2===0)!==b)?'w':'b'; }
function rvIsBook(s,i){

}
async function startReview(s){
  const moves=s.game.moves.slice(), n=moves.length;
  if(n<2){ toast('Play a few moves first, then review the game.'); return; }
  if(rvDone(s)){ renderAll(); return; }
  const R={key:rvKey(s),n,running:true,done:0,pos:[],moves:[]};
  s.review=R; renderPanel();
  const e=EngineFactory();
  for(let i=0;i<=n;i++){
    if(s.review!==R) return;
    if(rvKey(s)!==R.key){ s.review=null; if(cur()===s) renderPanel(); return; }
    e.loadUci(s.game.start,moves.slice(0,i));
    const st=e.status(); let r;
    if(st==='checkmate') r={score:-RV_MATE,move:null};
    else if(st!=='ongoing'&&i===n) r={score:0,move:null};
    else r=await askEngine(s.game.start,moves.slice(0,i),{timeMs:420,maxDepth:16});

    if(rvIsBook(s,i)&&loss<10) cls='book';

  }

}
// Which moves "Next mistake" steps through: your moves against the computer, everyone's otherwise.
function rvList(s){ const R=rvDone(s); if(!R) return []; const mine=s===sessions.play&&s.kind==='cpu'?s.human:(s===sessions.family&&s.myColor)||null;

function rvEvalWords(sc,c){ // sc from c's point of view

  h+=`<p class="note" style="margin-top:14px">Games are saved online. Play live together, or take turns whenever you like, like chess by post.</p>`;
  body.innerHTML=h;
  const link=s.gid?Fam.link(s.gid):'';
  const copy=()=>{ (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Link copied')).catch(()=>toast('Press and hold the link to copy it')); };
  if($('#lbShare')) $('#lbShare').onclick=()=>{ if(navigator.share){ navigator.share({title:'Timber Chess',text:`${Fam.myName||'I'} wants to play chess with you. Tap to join (or copy this link, open Timber Chess, go to Family → Join with code and paste it):`,url:link}).catch(()=>{}); } else copy(); };
  if($('#lbCopy')) $('#lbCopy').onclick=copy;
  if($('#lbJoin')) $('#lbJoin').onclick=openJoin;
  if($('#lbCancel')) $('#lbCancel').onclick=()=>{ Fam.cancel(); renderLobby(); };
  if($('#lbName')) $('#lbName').onclick=()=>askName(openLobby);
  if($('#lbNew')) $('#lbNew').onclick=()=>{ Fam.lobbyPick=true; renderLobby(); };
  body.querySelectorAll('[data-forget]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.forget, g=Fam.games()[id], done=g&&g.status==='over';
    confirmSheet('Remove this game?',done?'It will be deleted from this phone.':'It will be deleted from this phone. Your friend won\'t be told, but they can remove it on their phone too.','Remove',()=>{
      if(id===s.gid) Fam.cancel(); else Fam.forget(id);
      toast('Game removed'); openLobby();
    });
  });
  body.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{ const g=Fam.games()[b.dataset.resume]; if(g){ closeSheet(); Fam.enter(g,g.role,false); } });
}

$('#btnSettings').addEventListener('click',()=>{ ac(); openSettings(); });
$('#btnProgress').addEventListener('click',()=>{ ac(); openProgress(); });
$('#btnSearch').addEventListener('click',()=>{ ac(); openSearch(); });

/* ================= boot ================= */
applyTheme();
window.addEventListener('resize',()=>{ layout(); });
const startTab=store.get('tab','play');
S.tab=['play','openings','puzzles','family'].includes(startTab)?startTab:'play';
if(S.tab==='openings'||S.tab==='puzzles') S.tab='play';
layout();
switchTab(S.tab,true);
const ps=sessions.play;
if(ps.kind==='cpu'&&ps.eng.status()==='ongoing'&&(ps.eng.turn()?'b':'w')!==ps.human) setTimeout(cpuMove,500);
else if(ps.eng.status()!=='ongoing'){ ps.over=resultText(ps.eng.status(),ps.eng.turn()?'b':'w'); renderAll(); }
if(ps.clock&&ps.clock.flag&&!ps.over){ ps.over=timeoutResult(ps.eng,ps.clock.flag); renderAll(); } // it ran out before the app was closed
clockStart(ps); // a saved clock carries on (time while the app was closed is not counted)
Fam.init();
setTimeout(()=>{ try{ checkBadges(); }catch(e){} },2500); // progress made before badges existed earns them too
if(settings.board3d) setTimeout(()=>enable3D(),0);
if('serviceWorker' in navigator&&location.protocol==='https:'){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
})();

</script>
</body>
</html>
