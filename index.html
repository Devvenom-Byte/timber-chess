<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A wooden chess set for your phone. Play the computer, learn openings, solve puzzles, or invite a friend with a link. No ads.">
<meta name="theme-color" content="#15100c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Timber Chess">
<meta property="og:title" content="Timber Chess">
<meta property="og:description" content="Come and play chess with me. No ads, no sign-up.">
<meta property="og:image" content="icon-512.png">
<title>Timber Chess</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15100c; --panel:#211812; --panel2:#2a1f17; --line:rgba(255,228,190,.09);
  --text:#f4e8d6; --muted:#b5a189; --accent:#e3a55a; --accent2:#f2c27f; --good:#86b86b; --bad:#de6a55;
  --sq:44px; --frame:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,#2a1d14 0%,#15100c 60%,#0e0a07 100%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%;max-width:1200px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 4px calc(14px + env(safe-area-inset-left))}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:26px}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
main{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0;overflow:hidden}
.table{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0}
.strip{display:flex;align-items:center;gap:8px;height:34px;padding:0 4px;font-size:14px;width:calc(var(--sq)*8 + var(--frame)*2)}
.av{width:30px;height:30px;border-radius:9px;background:var(--panel2);display:grid;place-items:center;font-size:16px;border:1px solid var(--line);flex:none;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av.turn{box-shadow:0 0 0 2px var(--accent)}
.pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.psub{font-size:12px;color:var(--muted)}
.caps{display:flex;align-items:center;margin-left:auto;min-width:0}
.caps img{width:18px;height:18px;margin-left:-6px}
.caps img:first-child{margin-left:0}
.caps .adv{font-size:12px;color:var(--muted);margin-left:4px}
.lvchip{flex:none;display:inline-flex;align-items:center;gap:2px;height:26px;padding:0 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:inherit;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.lvchip:active{box-shadow:0 0 0 2px var(--accent)}
.online-dot{width:8px;height:8px;border-radius:50%;background:#6b5a48;display:inline-block;margin-left:6px}
.online-dot.on{background:var(--good);box-shadow:0 0 6px var(--good)}
.thinking{display:inline-flex;gap:3px;margin-left:6px}
.thinking i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* frame + board */
.frame{position:relative;padding:var(--frame);border-radius:14px;
  background-color:#3b2416;
  box-shadow:0 22px 50px rgba(0,0,0,.65),0 2px 0 rgba(255,220,170,.12) inset,0 -2px 0 rgba(0,0,0,.4) inset}
.frame::before{content:"";position:absolute;inset:0;border-radius:14px;background:var(--framegrain);background-size:cover;opacity:1;pointer-events:none}
.frame::after{content:"";position:absolute;inset:calc(var(--frame) - 3px);border-radius:3px;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 3px rgba(255,214,160,.10);pointer-events:none}
.flabels,.rlabels{position:absolute;display:flex;pointer-events:none;font-family:Fraunces,Georgia,serif;font-size:11px;font-weight:700;color:rgba(255,226,186,.55);text-shadow:0 1px 0 rgba(0,0,0,.6)}
.flabels{left:var(--frame);right:var(--frame);bottom:0;height:var(--frame);align-items:center}
.flabels span{flex:1;text-align:center}
.rlabels{top:var(--frame);bottom:var(--frame);left:0;width:var(--frame);flex-direction:column}
.rlabels span{flex:1;display:flex;align-items:center;justify-content:center}
.nocoords .flabels,.nocoords .rlabels{display:none}
#board{position:relative;width:calc(var(--sq)*8);height:calc(var(--sq)*8);touch-action:none;user-select:none;-webkit-user-select:none;border-radius:2px;overflow:visible}
#board .bgimg{position:absolute;inset:0;width:100%;height:100%;border-radius:2px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4)}
.layer{position:absolute;inset:0;pointer-events:none}
.hl{position:absolute;width:var(--sq);height:var(--sq)}
.hl.last{background:rgba(255,196,84,.32)}
.hl.sel{background:rgba(255,214,120,.45)}
.hl.check{background:radial-gradient(circle,rgba(255,60,40,.85) 0%,rgba(255,60,40,.45) 40%,rgba(255,60,40,0) 72%)}
.hl.hover{box-shadow:inset 0 0 0 3px rgba(255,236,190,.85)}
.hl.wrong{background:rgba(222,80,60,.5);animation:fade 1s forwards}
.hl.right{background:rgba(120,190,90,.5);animation:fade 1.2s forwards}
.hl.goal{background:radial-gradient(circle,rgba(255,200,90,.85) 0%,rgba(255,200,90,.45) 40%,rgba(255,200,90,.12) 72%);box-shadow:inset 0 0 0 4px rgba(255,205,110,.95);animation:goalpulse 1.6s ease-in-out infinite}
@keyframes goalpulse{50%{opacity:.6}}
@keyframes fade{to{opacity:0}}
.dot{position:absolute;width:var(--sq);height:var(--sq);display:grid;place-items:center}
.dot::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(40,20,8,.42);box-shadow:0 1px 0 rgba(255,230,190,.25)}
.dot.cap::after{width:88%;height:88%;background:none;border:calc(var(--sq)*.07) solid rgba(40,20,8,.38);box-shadow:none}
.pc{position:absolute;left:0;top:0;width:var(--sq);height:var(--sq);will-change:transform;z-index:2}
.pc img{width:100%;height:100%;display:block;transform-origin:50% 22%;pointer-events:none;-webkit-user-drag:none}
.pc.lifted{z-index:20}
.pc.lifted img{filter:drop-shadow(0 calc(var(--sq)*.22) calc(var(--sq)*.12) rgba(0,0,0,.45))}
.pc.hop img{animation:hop .26s ease-out}
@keyframes hop{0%{transform:scale(1)}45%{transform:scale(1.12) translateY(-7%)}100%{transform:scale(1)}}
.pc.gone{transition:opacity .18s,transform .18s!important;opacity:0}
.pc.born img{animation:born .25s ease-out}
@keyframes born{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.pc.shake img{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9%) rotate(-6deg)}40%{transform:translateX(8%) rotate(5deg)}60%{transform:translateX(-5%)}80%{transform:translateX(3%)}}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#promo{position:absolute;z-index:40;display:none;flex-direction:column;background:linear-gradient(#f5e6cc,#e3c99d);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.6);overflow:hidden}
#promo button{width:var(--sq);height:var(--sq);display:block}
#promo button:hover,#promo button:active{background:rgba(120,70,20,.2)}
#promo img{width:100%;height:100%}
.float-emoji{position:absolute;font-size:30px;pointer-events:none;z-index:60;animation:floatup 1.8s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-10px) scale(1.1)}100%{transform:translateY(-90px) scale(1);opacity:0}}

/* panel */
.panel{width:100%;max-width:640px;padding:6px 12px 8px;display:flex;flex-direction:column;gap:8px;min-height:0;flex:1;overflow-y:auto}
.status{display:flex;align-items:center;gap:8px;min-height:22px;font-size:14px;color:var(--muted)}
.status b{color:var(--text);font-weight:600}
.status .op{margin-left:auto;font-family:Fraunces,Georgia,serif;color:var(--accent2);font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.controls{display:flex;gap:8px}
.btn{flex:1;min-height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;transition:transform .08s,background .15s}
.btn:active{transform:scale(.97);background:var(--panel2)}
.btn svg{width:18px;height:18px;opacity:.9}
.btn.primary{background:linear-gradient(180deg,#e9b06a,#c98a3f);color:#2a1606;border:0;font-weight:600}
.btn[disabled]{opacity:.4;pointer-events:none}
.moves{display:flex;align-items:center;gap:6px}
.mlist{flex:1;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px 0;white-space:nowrap;font-size:14px}
.mlist::-webkit-scrollbar{display:none}
.mlist .num{color:var(--muted);padding:4px 2px 4px 8px;font-size:12px;align-self:center}
.mlist .mv{padding:5px 7px;border-radius:7px;cursor:pointer}
.mlist .mv.cur{background:rgba(227,165,90,.22);color:var(--accent2)}
.mlist .empty{color:var(--muted);font-size:13px;padding:4px}
.navb{width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.navb svg{width:16px;height:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 4px;font-family:Fraunces,Georgia,serif;font-size:17px;font-weight:700}
.card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.progress{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
.progress i{width:14px;height:6px;border-radius:3px;background:rgba(255,230,190,.12)}
.progress i.done{background:var(--good)}
.progress i.now{background:var(--accent)}
.feedback{font-size:14px;min-height:20px;margin-top:8px}
.feedback.good{color:var(--good)}.feedback.bad{color:var(--bad)}
.reacts{display:flex;gap:6px;justify-content:space-between}
.reacts button{flex:1;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:19px}
.reacts button:active{transform:scale(.92)}
.banner{background:rgba(227,165,90,.14);border:1px solid rgba(227,165,90,.3);color:var(--accent2);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;align-items:center;gap:8px}
.banner button{margin-left:auto;color:var(--text);font-weight:600;text-decoration:underline}

/* tabs */
nav.tabs{display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px;border-top:1px solid var(--line);background:rgba(18,13,9,.85);backdrop-filter:blur(8px)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:11.5px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--accent2);background:rgba(227,165,90,.1)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;background:#1e1611;border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));z-index:100;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}
#sheet .xbtn{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:14px}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:rgba(255,230,190,.2);margin:4px auto 10px}
#sheet h2{font-family:Fraunces,Georgia,serif;margin:4px 0 12px;font-size:22px}
#sheet h4{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:10px 6px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 0 rgba(255,230,190,.08) inset}
.colors{display:flex;gap:10px}
.colors button{flex:1;padding:10px 6px;border-radius:14px;background:var(--panel);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.colors button img{width:48px;height:48px}
.colors button.on{border-color:var(--accent);color:var(--text)}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.levels button{text-align:left;padding:10px 12px;border-radius:12px;background:var(--panel);border:2px solid transparent}
.levels button b{display:block;font-size:14.5px}
.levels button span{font-size:12px;color:var(--muted)}
.levels button.on{border-color:var(--accent)}
.lvbar{display:flex;gap:2px;margin-top:6px}.lvbar i{height:4px;flex:1;border-radius:2px;background:rgba(255,230,190,.12)}.lvbar i.f{background:var(--accent)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:left;width:100%}
.item .t{flex:1;min-width:0}
.item b{display:block;font-size:14.5px}
.item span{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tag{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(255,230,190,.08);color:var(--muted);flex:none}
.item .tag.good{background:rgba(134,184,107,.18);color:var(--good)}
.item .rm{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:rgba(255,230,190,.06);border:1px solid var(--line);font-size:13px;cursor:pointer}
.item .rm:active{background:rgba(222,80,60,.25);color:#fff}
.item .go{flex:none;padding:8px 12px;border-radius:10px;background:linear-gradient(180deg,#e9b06a,#c98a3f);color:#2a1606;font-weight:600;font-size:13px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-size:15px}
.sw{width:46px;height:28px;border-radius:14px;background:#3a2c22;position:relative;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#f4e8d6;transition:transform .2s}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(18px)}
.themes{display:flex;gap:10px}
.themes button{flex:1;border-radius:12px;padding:6px;background:var(--panel);border:2px solid transparent;font-size:12px;color:var(--muted)}
.themes button img{width:100%;border-radius:6px;display:block;margin-bottom:4px}
.themes button.on{border-color:var(--accent);color:var(--text)}
.big{font-family:Fraunces,Georgia,serif;font-size:30px;text-align:center;margin:10px 0 2px}
.sub{text-align:center;color:var(--muted);margin-bottom:16px}
.row{display:flex;gap:8px;margin-top:10px}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.note b{color:var(--text)}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:#2b2018;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:120;transition:transform .25s;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
@media (min-width:900px){
  main{flex-direction:row;align-items:center;justify-content:center;gap:28px;padding:0 20px}
  .panel{max-width:380px;flex:none;align-self:center}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><img id="brandImg" alt="">Timber Chess</div>
    <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main>
    <section class="table">
      <div class="strip" id="stripTop"></div>
      <div class="frame" id="frame">
        <div class="rlabels" id="rlabels"></div>
        <div id="board">
          <img class="bgimg" id="bgimg" alt="">
          <div class="layer" id="hlLayer"></div>
          <div class="layer" id="dotLayer"></div>
          <div class="layer" id="pcLayer"></div>
          <svg id="arrows"></svg>
          <div id="promo"></div>
        </div>
        <div class="flabels" id="flabels"></div>
      </div>
      <div class="strip" id="stripBottom"></div>
    </section>
    <section class="panel" id="panel"></section>
  </main>
  <nav class="tabs" id="tabs">
    <button data-tab="play"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 21h8M9 21l.8-5h4.4l.8 5M9.5 16c-1.5-1.6-2.5-3.2-2.5-5.2C7 8 9 6 12 6s5 2 5 4.8c0 2-1 3.6-2.5 5.2M10 6V3.5M14 6V3.5M12 3v3"/></svg>Play</button>
    <button data-tab="family"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M2.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5M14 15c.8-.6 1.8-1 3-1 2.3 0 4 1.5 4.5 4"/></svg>Family</button>
    <button data-tab="openings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5.5C6.5 4.5 9.5 4.6 12 6.5v13c-2.5-1.9-5.5-2-8-1V5.5zM20 5.5c-2.5-1-5.5-.9-8 1v13c2.5-1.9 5.5-2 8-1V5.5z"/></svg>Openings</button>
    <button data-tab="puzzles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M10 3h4v3a2 2 0 1 0 0 0h4v4a2 2 0 1 1 0 4v4H4v-4a2 2 0 1 0 0-4V6h4"/></svg>Puzzles</button>
    <button data-tab="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></svg>Learn</button>
  </nav>
</div>
<div id="scrim"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
function EngineFactory(){
  'use strict';
  const P=1,N=2,B=3,R=4,Q=5,K=6;
  const CHARS=' PNBRQK  pnbrqk';

        const m=moves[(Math.random()*moves.length)|0];

      const scored=[];
      for(const m of moves){
        make(m); const s=-search(depth-1,-INF,INF,1,true); unmake();
        scored.push([m,s]);
      }
      scored.sort((a,b)=>b[1]-a[1]);

      if(top>MATE-1000 && depth>=2) return {move:uci(scored[0][0]),score:top,depth};

      let r=Math.random()*tot;
      for(let i=0;i<scored.length;i++){ r-=w[i]; if(r<=0) return {move:uci(scored[i][0]),score:scored[i][1],depth}; }
      return {move:uci(scored[0][0]),score:top,depth};
    }
    const timeMs=opts.timeMs||1000, maxDepth=opts.maxDepth||64;
    const t0=Date.now(); stopTime=t0+timeMs;

    for(let d=1;d<=maxDepth;d++){

      if(Math.abs(s)>MATE-1000 && d>=(opts.mateDepth||0)) break;
      if(Date.now()-t0>timeMs*0.55) break;

  }

  function status(){

    if(half>=100) return 'fifty';
    if(insufficient()) return 'insufficient';

  }

    for(let i=0;i<list.length;i++){ const m=fromUci(list[i]); if(!m) return i; make(m); }
    return list.length;
  }

  return {
    START, MATE, setFen, getFen, legal, make, unmake, perft, uci, fromUci, san, fromSan, think, status,
    inCheck:()=>inCheck(turn), turn:()=>turn, board:boardArray, loadUci, evaluate,
    sqName, kingSquare:()=>kingSq[turn], hash:()=>hH+':'+hL, ply:()=>sp
  };
}

let AC=null, noiseBuf=null;
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  if(!noiseBuf){ const n=Math.floor(AC.sampleRate*0.12); noiseBuf=AC.createBuffer(1,n,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); }
  return AC;
}
function knock(gain=.6,pitch=1,delay=0){
  if(!settings.sound) return; const c=ac(); if(!c) return;
  const t=c.currentTime+delay;
  const src=c.createBufferSource(); src.buffer=noiseBuf;
  const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1250*pitch; bp.Q.value=2.2;
  const g=c.createGain(); g.gain.setValueAtTime(gain*1.4,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.09);
  src.connect(bp).connect(g).connect(c.destination); src.start(t); src.stop(t+0.12);
  const o=c.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(240*pitch,t); o.frequency.exponentialRampToValueAtTime(120*pitch,t+0.08);
  const og=c.createGain(); og.gain.setValueAtTime(gain*0.55,t); og.gain.exponentialRampToValueAtTime(0.001,t+0.1);
  o.connect(og).connect(c.destination); o.start(t); o.stop(t+0.12);
}
function ping(freq,delay=0,gain=.12,len=.35){
  if(!settings.sound) return; const c=ac(); if(!c) return; const t=c.currentTime+delay;
  const o=c.createOscillator(); o.type='triangle'; o.frequency.value=freq;
  const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+len);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t+len+0.05);
}

  check(){ knock(.7,1); ping(988,.02,.08,.3); },

const RULES=EngineFactory();
function sanToUci(line,start){ RULES.setFen(start||START); const out=[]; for(const s of line.split(' ')){ const m=RULES.fromSan(s); if(!m) break; out.push(RULES.uci(m)); RULES.make(m); } return out; }

for(const o of OPENINGS) NAME_KEYS.push([o.uci.slice(0,o.key).join(' '),o.name,o.key]);
for(const [m,n] of OPENING_NAMES){ const u=sanToUci(m); NAME_KEYS.push([u.join(' '),n,u.length]); }
function openingName(moves){
  let best=null,len=0;
  for(const [k,n,l] of NAME_KEYS){ if(l>len && l<=moves.length && moves.slice(0,l).join(' ')===k){ best=n; len=l; } }

}

  return cands.length?cands[(Math.random()*cands.length)|0]:null;
}

let worker=null, wid=0; const pending=new Map(); let fallbackEng=null;
try{
  const src=EngineFactory.toString()+';const E=EngineFactory();onmessage=function(e){var d=e.data;E.loadUci(d.start,d.moves);var r=E.think(d.opts);postMessage({id:d.id,r:r});};';
  worker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));
  worker.onmessage=e=>{ const p=pending.get(e.data.id); if(p){ pending.delete(e.data.id); p.resolve(e.data.r); } };
  worker.onerror=()=>{ worker=null; for(const [id,p] of pending){ pending.delete(id); runLocal(p.job).then(p.resolve); } };
}catch(e){ worker=null; }

  const job={start,moves:moves.slice(),opts};
  if(!worker) return runLocal(job);

}

function choosePromotion(to,color){
  return new Promise(res=>{
    const box=$('#promo'); const [x,y]=sqXY(to);
    const order=['q','n','r','b'];
    box.innerHTML=order.map(p=>`<button data-p="${p}"><img src="${IMG[color+p.toUpperCase()]}" alt="${p}"></button>`).join('');
    const top=y<SQ*4?y:y-SQ*3;
    box.style.left=x+'px'; box.style.top=top+'px'; box.style.display='flex';
    const done=p=>{ box.style.display='none'; $('#scrim').removeEventListener('click',off); res(p); };
    const off=()=>done(null);
    box.querySelectorAll('button').forEach(b=>b.onclick=ev=>{ ev.stopPropagation(); done(b.dataset.p); });
    setTimeout(()=>{ const once=ev=>{ if(!box.contains(ev.target)){ document.removeEventListener('pointerdown',once,true); if(box.style.display!=='none'){ ev.stopPropagation(); done(null);} } }; document.addEventListener('pointerdown',once,true); },0);
  });
}

async function attemptMove(from,to,dropped){
  const s=cur(); const opts=S.targets.get(to); if(!opts) return;
  let u=opts[0];
  if(opts.length>1){
    const color=s.eng.turn()?'b':'w';
    if(dropped){ const pe=pieceEls.find(p=>p.s===from); if(pe){ pe.el.style.transition='transform .12s'; pe.img.style.transform=''; pe.el.classList.remove('lifted'); const [x,y]=sqXY(to); pe.el.style.transform=`translate(${x}px,${y}px)`; } }
    const pick=settings.autoQueen?'q':await choosePromotion(to,color);
    if(!pick){ const pe=pieceEls.find(p=>p.s===from); if(pe) settle(pe,false); D.dropEl=null; deselect(); return; }
    u=opts.find(x=>x[4]===pick)||opts[0];
  }
  if(S.tab==='openings'){
    const exp=s.op.uci[s.game.moves.length];
    if(u!==exp){
      s.mistakes++; s.errs++; const pe=pieceEls.find(p=>p.s===from); D.dropEl=null;
      if(pe){ settle(pe,true); setTimeout(()=>{pe.el.classList.remove('shake');void pe.el.offsetWidth;pe.el.classList.add('shake');},180); }
      flash(to,'wrong'); SFX.bad(); buzz([20,40,20]); deselect();
      const m=s.eng.fromUci(exp); const expSan=m?s.eng.san(m):'';
      s.msg=s.mistakes>=2?`Not this time. The book move is ${expSan} (shown by the arrow).`:'Not the book move. Have another go.'; s.msgType='bad';
      if(s.mistakes>=2) S.hint=exp;
      renderPanel(); renderHL(); return;
    }
  }
  commitMove(u,{dropped});
}

function commitMove(u,{dropped=false,silent=false,session=null}={}){
  const s=session||cur();
  const m=s.eng.fromUci(u); if(!m) return false;
  const san=s.eng.san(m);
  const flagCastle=san.startsWith('O-O'), cap=san.includes('x');
  s.eng.make(m); s.game.moves.push(u); s.game.sans.push(san);
  const visible=s===cur();
  if(visible){
    S.selected=-1; S.targets=new Map(); S.hint=null;
    const from=nameSq(u.slice(0,2)), to=nameSq(u.slice(2,4));
    const hints=[[from,to]];
    if(flagCastle){ const r=from>>3; if(to>from) hints.push([r*8+7,r*8+5]); else hints.push([r*8,r*8+3]); }
    renderPieces({hints,ms:dropped?110:240});
    renderHL();
  }
  if(!silent){
    const delay=dropped?40:(visible?200:0);
    setTimeout(()=>{ if(san.includes('#')||san.includes('+')) SFX.check(); else if(flagCastle) SFX.castle(); else if(cap) SFX.capture(); else SFX.move(); buzz(cap?18:10); },delay);
  }
  afterMove(s);
  return true;
}

/* ================= game flow ================= */
function statusOf(s){ const st=s.eng.status(); return st; }
function resultText(st,loserColor){
  const winner=loserColor==='w'?'Black':'White';
  switch(st){ case 'checkmate': return {title:'Checkmate',sub:`${winner} wins`,win:loserColor==='w'?'b':'w'};
    case 'stalemate': return {title:'Stalemate',sub:'It\'s a draw',win:null};
    case 'fifty': return {title:'Draw',sub:'Fifty moves without a capture or pawn move',win:null};
    case 'insufficient': return {title:'Draw',sub:'Not enough pieces left to checkmate',win:null};
    case 'repetition': return {title:'Draw',sub:'Same position three times',win:null}; }
  return null;
}
function afterMove(s){
  if(s===sessions.play) savePlay();
  if(s===sessions.play){
    const st=statusOf(s);
    if(st!=='ongoing'){ s.over=resultText(st,s.eng.turn()?'b':'w'); renderAll(); setTimeout(()=>showGameOver(s),700); return; }
    renderAll();
    if(s.kind==='cpu'&&(s.eng.turn()?'b':'w')!==s.human) cpuMove();
    return;
  }
  if(s===sessions.openings){ openingsAfter(s); return; }
  if(s===sessions.puzzles){ puzzleAfter(s); return; }
  if(s===sessions.learn){ learnAfter(s); return; }
  if(s===sessions.family){ Fam.afterLocalMove(); return; }
}
async function cpuMove(){
  const s=sessions.play; const tok=++S.token; S.thinking=true; renderStrips(); renderPanel();
  const t0=Date.now();
  let u=null;
  if(s.game.start===START&&s.game.moves.length<14&&s.level>=1&&Math.random()<(s.level>=3?0.92:0.6)) u=bookMove(s.game.moves);
  if(!u){ const r=await askEngine(s.game.start,s.game.moves,LEVELS[s.level].opts); u=r&&r.move; }
  const wait=Math.max(0,(s.level<3?650:450)+Math.random()*350-(Date.now()-t0));
  await new Promise(r=>setTimeout(r,wait));
  if(tok!==S.token) return;
  S.thinking=false;
  if(u) commitMove(u,{session:s}); else renderAll();
}
function undo(){
  const s=sessions.play; if(!s.game.moves.length) return;
  S.token++; S.thinking=false;
  let n=1;
  if(s.kind==='cpu'){ const stm=s.eng.turn()?'b':'w'; n=stm===s.human?2:1; if(s.game.moves.length<n) n=s.game.moves.length; }
  s.game.moves.splice(-n); s.game.sans.splice(-n);
  s.eng.loadUci(s.game.start,s.game.moves); s.over=null; s.view=null; S.hint=null; deselect();
  renderPieces({ms:200}); renderAll(); savePlay(); SFX.move();
  if(s.kind==='cpu'&&(s.eng.turn()?'b':'w')!==s.human) cpuMove();
}
function startPlay(kind,colorPref,level){
  const s=sessions.play; S.token++; S.thinking=false;
  s.kind=kind; s.level=level; s.human=colorPref==='r'?(Math.random()<.5?'w':'b'):colorPref;
  s.game=newGame(); s.eng.loadUci(START,[]); s.over=null; s.view=null; s.orientation=kind==='cpu'?s.human:'w';
  S.hint=null; deselect(); savePlay();
  if(S.tab!=='play') switchTab('play',true); else { renderLabels(); renderPieces({ms:260}); renderAll(); }
  if(kind==='cpu'&&s.human==='b') setTimeout(cpuMove,400);
}
async function showHint(){
  const s=cur(); if(s.over||S.thinking) return;
  if(S.tab==='openings'){ S.hint=s.op.uci[s.game.moves.length]||null; renderHL(); return; }
  if(S.tab==='learn'){ const st=learnStep(s); if(st&&!s.done&&!s.checking){ S.hint=st.sol; renderHL(); } return; }
  if(S.tab==='puzzles'){
    S.busy=true; renderPanel();
    const r=await askEngine(s.game.start,s.game.moves,{maxDepth:2*s.left-1,timeMs:15000,noPrune:true,mateDepth:2*s.left-1});
    S.busy=false; if(r&&cur()===s){ S.hint=r.move; renderHL(); } renderPanel(); return;
  }
  const tok=S.token; S.busy=true; toast('Thinking…');
  const r=await askEngine(s.game.start,s.game.moves,{timeMs:900});
  S.busy=false;
  if(r&&tok===S.token&&cur()===s){ S.hint=r.move; renderHL(); }
}
function flip(){ const s=cur(); s.orientation=s.orientation==='w'?'b':'w'; renderPieces.o=s.orientation; if(s===sessions.play) savePlay(); renderLabels(); for(const pe of pieceEls){ pe.el.style.transition='transform .35s cubic-bezier(.25,.8,.25,1)'; placeEl(pe);} renderHL(); renderStrips(); }

const opDone=store.get('opDone',{});
function startOpening(op){
  const s=sessions.openings; S.token++;
  s.op=op; s.game=newGame(); s.eng.loadUci(START,[]); s.mistakes=0; s.errs=0; s.done=false; s.view=null; s.orientation=op.side; s.over=null;
  s.msg=op.side==='w'?'You play White. Make the first move.':'You play Black. Watch White\'s move, then reply.'; s.msgType='';
  S.hint=null; deselect();
  if(S.tab!=='openings') switchTab('openings',true); else { renderLabels(); renderPieces({ms:240}); renderAll(); }
  if(op.side==='b') bookReply(s);
}
function bookReply(s){
  const tok=S.token;
  setTimeout(()=>{ if(tok!==S.token||sessions.openings!==s) return; const u=s.op.uci[s.game.moves.length]; if(u) commitMove(u,{session:s}); },650);
}
function openingsAfter(s){
  const n=s.game.moves.length, total=s.op.uci.length;
  const mine=(n%2===1)===(s.op.side==='w');
  if(mine){ const pe=nameSq(s.game.moves[n-1].slice(2,4)); flash(pe,'right'); s.msg=['Good move.','Correct!','Right on.','That\'s the one.','Nice.'][n%5]; s.msgType='good'; s.mistakes=0; }
  if(n>=total){
    s.done=true; const clean=s.errs===0;
    opDone[s.op.id]=Math.max(opDone[s.op.id]||0,clean?2:1); store.set('opDone',opDone);
    s.msg=clean?'Line complete with no mistakes! ★':'Line complete! Try again for a clean run.'; s.msgType='good';
    setTimeout(()=>SFX.win(),300);
  } else if(mine){ bookReply(s); }
  renderAll();
}

PUZZLES.forEach((p,i)=>{ p.i=i; if(p.start){ const u=sanToUci(p.start); const e=EngineFactory(); e.loadUci(START,u); p.fen=e.getFen(); } });
const PUZ_ORDER=PUZZLES.slice().sort((a,b)=>a.mate-b.mate);
function startPuzzle(p){
  const s=sessions.puzzles; S.token++;
  s.idx=p.i; s.p=p; s.game=newGame(p.fen); s.eng.loadUci(p.fen,[]); s.left=p.mate; s.solved=false; s.view=null; s.over=null; s.checking=false;
  s.side=s.eng.turn()?'b':'w'; s.orientation=s.side; s.showHint=false;
  s.msg=`${s.side==='w'?'White':'Black'} to move. Find mate in ${p.mate}.`; s.msgType='';
  S.hint=null; deselect();
  if(S.tab!=='puzzles') switchTab('puzzles',true); else { renderLabels(); renderPieces({instant:true}); renderAll(); }
}
async function puzzleAfter(s){
  const n=s.game.moves.length;
  const myMove=(s.eng.turn()?'b':'w')!==s.side;
  if(!myMove){ renderAll(); return; }
  const st=s.eng.status();
  if(st==='checkmate'){ s.solved=true; puzSolved[s.p.i]=1; store.set('puzSolved',puzSolved); s.msg='Checkmate! Puzzle solved. ★'; s.msgType='good'; renderAll(); setTimeout(()=>SFX.win(),300); return; }
  const wrong=async(txt)=>{
    s.msg=txt; s.msgType='bad'; renderAll(); SFX.bad(); buzz([20,40,20]);
    const tok=S.token; await new Promise(r=>setTimeout(r,900)); if(tok!==S.token) return;
    s.game.moves.pop(); s.game.sans.pop(); s.eng.loadUci(s.game.start,s.game.moves); s.checking=false; renderPieces({ms:220}); renderAll();
  };
  if(s.left<=1){ s.checking=true; await wrong('Not mate. Try again.'); return; }
  s.checking=true; s.msg='Checking…'; s.msgType=''; renderAll();
  const tok=S.token;
  const r=await askEngine(s.game.start,s.game.moves,{maxDepth:2*(s.left-1),timeMs:15000,noPrune:true,mateDepth:2*(s.left-1)});
  if(tok!==S.token) return;
  if(r&&r.score<=-(RULES.MATE-2*(s.left-1))){
    s.left--; s.msg=`Good! Keep going: mate in ${s.left}.`; s.msgType='good'; renderAll();
    await new Promise(x=>setTimeout(x,550)); if(tok!==S.token) return;
    s.checking=false; commitMove(r.move,{session:s});
  } else await wrong('That lets the king escape. Try again.');
}

const learnDone=store.get('learnDone',{});
function learnStep(s){ return s.les?s.les.steps[s.step]:null; }
function loadLearnStep(s){
  const st=learnStep(s); S.token++;
  s.game=newGame(st.fen); s.eng.loadUci(st.fen,[]); s.view=null; s.over=null; s.orientation='w'; s.checking=false;
  S.hint=null; S.selected=-1; S.targets=new Map();
  if(S.tab==='learn'){ renderLabels(); renderPieces({instant:true}); renderAll(); }
}
function startLesson(les){
  const s=sessions.learn; s.les=les; s.step=0; s.done=false; s.msg=''; s.msgType='';
  loadLearnStep(s);
  if(S.tab!=='learn') switchTab('learn',true);
}
function learnOk(st,u,s){
  const g=st.goal;
  if(g.uci) return g.uci.includes(u.slice(0,4));
  if(g.mate) return s.eng.status()==='checkmate';
  if(g.check) return s.eng.inCheck();
  if(g.to&&!g.to.includes(u.slice(2,4))) return false;
  if(g.pc){ const p=s.eng.board()[nameSq(u.slice(2,4))]; if(!p||p.toUpperCase()!==g.pc) return false; }
  return true;
}
function learnAfter(s){
  const st=learnStep(s), u=s.game.moves[s.game.moves.length-1], tok=S.token;
  s.checking=true;
  const show=()=>{ if(S.tab==='learn') renderAll(); };
  if(learnOk(st,u,s)){
    if(S.tab==='learn') flash(nameSq(u.slice(2,4)),'right');
    s.msg=st.ok||'Well done!'; s.msgType='good'; show();
    setTimeout(()=>{
      if(tok!==S.token) return;
      if(s.step+1<s.les.steps.length){ s.step++; loadLearnStep(s); }
      else { s.done=true; s.checking=false; learnDone[s.les.id]=1; store.set('learnDone',learnDone); s.msg=s.msg+' Lesson complete! ★'; show(); SFX.win(); }
    },1800);
  } else {
    s.msg=st.wrong||'Not quite. Have another go, or tap Hint.'; s.msgType='bad'; show(); SFX.bad(); buzz([20,40,20]);
    setTimeout(()=>{
      if(tok!==S.token) return;
      s.game.moves.pop(); s.game.sans.pop(); s.eng.loadUci(s.game.start,s.game.moves); s.checking=false;
      if(S.tab==='learn'){ renderPieces({ms:220}); renderAll(); }
    },1100);
  }
}

const PEER_PREFIX='timberchess-v1-';
function loadPeerLib(){
  if(window.Peer) return Promise.resolve(true);
  const urls=['https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js','https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'];
  return new Promise(res=>{
    const tryAt=i=>{
      if(i>=urls.length) return res(false);
      const sc=document.createElement('script'); sc.src=urls[i]; sc.async=true;
      sc.onload=()=>res(!!window.Peer); sc.onerror=()=>{ sc.remove(); tryAt(i+1); };
      document.head.appendChild(sc);
    };
    tryAt(0);
  });
}

  sendState(conn){ const s=sessions.family; if(!s.gid) return; const st=this.state4(); st.react=s.react||null; this.send(conn,{t:'state',st,names:this.seatNames()}); },

  merge(src,by){

    }

  },

  el.style.left=(r.left+40+Math.random()*30)+'px'; el.style.top=(r.top-10)+'px'; el.style.position='fixed'; document.body.appendChild(el); setTimeout(()=>el.remove(),1900);

function capturedInfo(board){
  const init={p:8,n:2,b:2,r:2,q:1}, val={p:1,n:3,b:3,r:5,q:9}; const cnt={w:{p:0,n:0,b:0,r:0,q:0},b:{p:0,n:0,b:0,r:0,q:0}}; let mat={w:0,b:0};
  for(const p of board){ if(!p) continue; const c=colorOf(p), t=p.toLowerCase(); if(t!=='k'){ cnt[c][t]++; mat[c]+=val[t]; } }
  const lost={w:[],b:[]};
  for(const c of 'wb') for(const t of 'qrbnp'){ const n=Math.max(0,init[t]-cnt[c][t]); for(let i=0;i<n;i++) lost[c].push(t); }
  return {lost,diff:mat.w-mat.b};
}
function stripHTML(color,name,sub,avatar,{turn,thinking,online,lvl,nocaps}={}){
  const {board}=displayed(); const ci=capturedInfo(board);
  const opp=color==='w'?'b':'w';
  const caps=ci.lost[opp].map(t=>`<img src="${IMG[opp+t.toUpperCase()]}" alt="">`).join('');
  const adv=color==='w'?ci.diff:-ci.diff;
  return `<div class="av${turn?' turn':''}">${avatar}</div><div style="min-width:0"><div class="pname">${esc(name)}${online!==undefined?`<span class="online-dot${online?' on':''}"></span>`:''}${thinking?'<span class="thinking"><i></i><i></i><i></i></span>':''}</div>${sub?`<div class="psub">${esc(sub)}</div>`:''}</div>${lvl?'<button class="lvchip" data-act="level" aria-label="Change computer level">Level ▾</button>':''}${nocaps?'':`<div class="caps">${caps}${adv>0?`<span class="adv">+${adv}</span>`:''}</div>`}`;
}
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function movesHTML(s){

function setView(v){

$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('[data-act],[data-i],[data-react]'); if(!b) return; ac();
  if(b.dataset.react){ Fam.react(b.dataset.react); return; }
  if(b.dataset.i){ setView(+b.dataset.i); return; }
  const s=cur();
  switch(b.dataset.act){
    case 'new': openNewGame(); break;
    case 'undo': undo(); break;
    case 'hint': showHint(); break;
    case 'flip': flip(); break;
    case 'prev': setView((s.view===null?s.game.moves.length:s.view)-1); break;
    case 'next': if(s.view!==null) setView(s.view+1); break;
    case 'live': setView(null); break;
    case 'oplist': openOpenings(); break;
    case 'oprestart': startOpening(s.op); break;
    case 'opplay': { const moves=s.game.moves.slice(); const side=s.op.side; startPlay('cpu',side,3); const p=sessions.play; for(const u of moves){ const m=p.eng.fromUci(u); p.game.sans.push(p.eng.san(m)); p.eng.make(m); p.game.moves.push(u);} renderPieces({instant:true}); renderAll(); savePlay(); if((p.eng.turn()?'b':'w')!==p.human) cpuMove(); toast('Playing on against Oak'); break; }
    case 'pzlist': openPuzzles(); break;
    case 'pzclue': s.showHint=true; renderPanel(); break;
    case 'pzretry': startPuzzle(s.p); break;
    case 'pznext': { const order=PUZ_ORDER; let i=s.idx<0?-1:order.indexOf(s.p); let nxt=order.find((p,k)=>k>i&&!puzSolved[p.i])||order[(i+1)%order.length]; startPuzzle(nxt); break; }
    case 'lslist': openLessons(); break;
    case 'lsretry': startLesson(s.les); break;
    case 'lsnext': { const i=s.les?LESSONS.indexOf(s.les):-1; startLesson(LESSONS.find((l,k)=>k>i&&!learnDone[l.id])||LESSONS[(i+1)%LESSONS.length]); break; }
    case 'lsplay': startPlay('cpu','w',0); toast('Your first game against Twig. Good luck!'); break;
    case 'lobby': openLobby(); break;
    case 'famjoin': openJoin(); break;
    case 'tabplay': switchTab('play'); break;
    case 'resign': confirmSheet('Resign this game?','Your opponent will be told you resigned.','Resign',()=>Fam.resign()); break;
    case 'draw': Fam.offerDraw(); break;
    case 'famcancel': Fam.cancel(); break;
  }
});

function switchTab(t,silent){
  if(D.active) return;
  S.tab=t; S.selected=-1; S.targets=new Map(); S.hint=null; S.flashes=[];
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));

    if(t==='openings'&&!cur().op) openOpenings();
    if(t==='family'&&Fam.state==='ready'&&!cur().gid) openLobby();

}

function copyPgn(){

}
function showGameOver(s){
  if(cur()!==s||!s.over) return;
  const o=s.over; let mine=null;
  if(s===sessions.play&&s.kind==='cpu') mine=s.human; if(s===sessions.family) mine=s.myColor;
  let big=o.title, sub=o.sub;
  if(mine&&o.win){ big=o.win===mine?'You win! 🎉':'You lost'; sub=o.title==='Checkmate'?'by checkmate':o.sub; }
  if(mine&&o.win===mine||(!mine&&o.win)) SFX.win(); else if(o.win) SFX.lose(); else SFX.draw();
  const isPlay=s===sessions.play;
  openSheet(`<div class="big">${esc(big)}</div><div class="sub">${esc(sub)}</div>
   <div class="row">${isPlay?`<button class="btn primary" id="goAgain">Play again</button><button class="btn" id="goNew">New game…</button>`:`<button class="btn primary" id="goLobby">Lobby</button>`}<button class="btn" id="goReview">Review</button></div>`,'over');
  $('#goReview').onclick=closeSheet;
  if(isPlay){ $('#goAgain').onclick=()=>{ closeSheet(); startPlay(s.kind,s.kind==='cpu'?(s.human==='w'?'b':'w'):'w',s.level); }; $('#goNew').onclick=()=>{ closeSheet(); openNewGame(); }; }
  else $('#goLobby').onclick=()=>{ openLobby(); };
}
// Join a game from inside the app by pasting the invite link (or just its code).
// Needed on iPhone, where tapping a link always opens Safari instead of the home-screen app.
function parseInvite(t){
  t=String(t||'').trim(); const m=t.match(/[?&]g=([a-z0-9]{6,24})/i);
  if(m) return m[1].toLowerCase();
  return /^[a-z0-9]{8}$/i.test(t)?t.toLowerCase():'';
}
function joinGame(g){
  const rec=Fam.games()[g];
  if(rec) Fam.enter(rec,rec.role,false); else Fam.enter({gid:g,white:null,black:null,creator:null,moves:[],status:'open'},'guest',false);
  if(!Fam.myName) askName();
}
function openJoin(){
  if(Fam.state!=='ready'){ toast(Fam.state==='loading'?'Getting ready… try again in a moment':Fam.textOff,3500); return; }
  const canPaste=!!(navigator.clipboard&&navigator.clipboard.readText);
  openSheet(`<h2>Join a game</h2><p class="note">Copy the invite link you were sent (from WhatsApp, a text or email) and paste it here.</p>
  <input id="joinIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste the invite link or code" style="width:100%;margin-top:12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:16px">
  <div class="row">${canPaste?'<button class="btn" id="joinPaste">Paste</button>':''}<button class="btn primary" id="joinGo">Join game</button></div>`,'join');
  const go=()=>{ const g=parseInvite($('#joinIn').value); if(!g){ toast('That doesn\'t look like an invite link. Copy the whole link and try again.',3500); return; } closeSheet(); joinGame(g); };
  $('#joinGo').onclick=go; $('#joinIn').onkeydown=e=>{ if(e.key==='Enter') go(); };
  if(canPaste) $('#joinPaste').onclick=()=>{ navigator.clipboard.readText().then(t=>{ $('#joinIn').value=t||''; if(parseInvite(t)) go(); }).catch(()=>{ $('#joinIn').focus(); toast('Press and hold the box, then tap Paste',3000); }); };
}
function openLobby(){ Fam.lobbyPick=false; if(Fam.state==='ready'&&!Fam.myName){ askName(openLobby); return; } openSheet('<div id="lobbyBody"></div>','lobby'); renderLobby(); }
function renderLobby(){
  const body=$('#lobbyBody'); if(!body) return;
  const s=sessions.family;
  if(Fam.state!=='ready'){ body.innerHTML=`<h2>Play a friend</h2><p class="note">${Fam.state==='loading'?'Getting ready…':esc(Fam.textOff)}</p>`; return; }
  // The colour picker is a lobby "mode", so the background refreshes (reconnect attempts every few
  // seconds) redraw the picker instead of wiping it back to the lobby.
  if(Fam.lobbyPick){
    body.innerHTML=`<h2>New game</h2><h4>You play as</h4><div class="colors" id="fc"><button data-c="w"><img src="${IMG.wK}" alt="">White</button><button data-c="r"><img src="${IMG.wN}" alt="">Random</button><button data-c="b"><img src="${IMG.bK}" alt="">Black</button></div><div class="row"><button class="btn" id="fcBack">Back</button></div>`;
    $('#fc').onclick=e=>{ const b=e.target.closest('button'); if(b){ Fam.lobbyPick=false; Fam.create(b.dataset.c); } };
    $('#fcBack').onclick=()=>{ Fam.lobbyPick=false; renderLobby(); };
    return;
  }
  let h=`<h2>Play a friend</h2>`;
  if(s.gid&&s.status==='open'&&Fam.role==='host'){
    const link=Fam.link(s.gid);
    h+=`<div class="card"><h3>Your invite link</h3><p style="word-break:break-all;color:var(--accent2);font-size:14px;margin:6px 0 10px">${esc(link)}</p>
      <div class="row" style="margin-top:0"><button class="btn primary" id="lbShare">Send link</button><button class="btn" id="lbCopy">Copy</button></div>
      <p class="note" style="margin-top:10px">Send it by WhatsApp, text or email. The game starts as soon as they open it. <b>Keep this app open</b> until they join.</p>
      <p class="note" style="margin-top:6px">Got the app on their phone? They can open it, go to <b>Family → Join with code</b> and paste the link.</p>
      <p class="note" style="margin-top:6px">${Fam.netOk?'🟢 Ready and waiting':'🟡 Connecting…'}</p></div>`;
    h+=`<div class="row"><button class="btn" id="lbCancel">Cancel this game</button></div>`;
  } else {
    h+=`<div class="row" style="margin-top:0"><button class="btn primary" id="lbNew">${ICON.plus}New game & invite link</button><button class="btn" id="lbJoin">Join with code</button></div>`;
  }
  const all=Fam.games(); const list=Object.values(all).filter(g=>g&&g.gid&&g.gid!==(s.status==='open'?s.gid:'')).sort((a,b)=>(b.updated||0)-(a.updated||0)).slice(0,8);
  if(list.length){
    h+=`<h4>Your games</h4><div class="list">`+list.map(g=>{
      const me=Fam.myId; const myC=g.white===me?'w':(g.black===me?'b':null); const opp=myC==='w'?g.black:g.white;
      const oppName=(g.names&&opp&&g.names[opp])||'Friend';
      const mv=Array.isArray(g.moves)?g.moves.length:0; const turn=mv%2===0?'w':'b';
      const st=g.status==='over'?'Finished':(g.status==='open'?'Waiting for them to join':(turn===myC?'Your move':'Their move'));
      const isCur=s.gid===g.gid;
      return `<div class="item"><div class="av">${myC==='b'?'♚':'♔'}</div><div class="t"><b>vs ${esc(opp?oppName:'(not joined yet)')}</b><span>${st} · ${Math.ceil(mv/2)} moves</span></div>${isCur?'<span class="tag good">Open</span>':`<button class="go" data-resume="${esc(g.gid)}">${g.status==='over'?'View':'Resume'}</button>`}<button class="rm" data-forget="${esc(g.gid)}" aria-label="Remove this game" title="Remove this game">✕</button></div>`;
    }).join('')+'</div>';
  }
  h+=`<h4>You</h4><div class="item"><div class="av">👤</div><div class="t"><b>${esc(Fam.myName||'Player')}</b><span>Your name in games</span></div><button class="tag" id="lbName">Change</button></div>`;
  h+=`<p class="note" style="margin-top:14px">Both players need the app open at the same time. Games are saved on each phone, so you can pick up where you left off.</p>`;
  body.innerHTML=h;
  const link=s.gid?Fam.link(s.gid):'';
  const copy=()=>{ (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('Link copied')).catch(()=>toast('Press and hold the link to copy it')); };
  if($('#lbShare')) $('#lbShare').onclick=()=>{ if(navigator.share){ navigator.share({title:'Timber Chess',text:`${Fam.myName||'I'} wants to play chess with you. Tap to join (or copy this link, open Timber Chess, go to Family → Join with code and paste it):`,url:link}).catch(()=>{}); } else copy(); };
  if($('#lbCopy')) $('#lbCopy').onclick=copy;
  if($('#lbJoin')) $('#lbJoin').onclick=openJoin;
  if($('#lbCancel')) $('#lbCancel').onclick=()=>{ Fam.cancel(); renderLobby(); };
  if($('#lbName')) $('#lbName').onclick=()=>askName(openLobby);
  if($('#lbNew')) $('#lbNew').onclick=()=>{ Fam.lobbyPick=true; renderLobby(); };
  body.querySelectorAll('[data-forget]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.forget, g=Fam.games()[id], done=g&&g.status==='over';
    confirmSheet('Remove this game?',done?'It will be deleted from this phone.':'It will be deleted from this phone. Your friend won\'t be told, but they can remove it on their phone too.','Remove',()=>{
      if(id===s.gid) Fam.cancel(); else Fam.forget(id);
      toast('Game removed'); openLobby();
    });
  });
  body.querySelectorAll('[data-resume]').forEach(b=>b.onclick=()=>{ const g=Fam.games()[b.dataset.resume]; if(g){ closeSheet(); Fam.enter(g,g.role,false); } });
}

$('#btnSettings').addEventListener('click',()=>{ ac(); openSettings(); });

/* ================= boot ================= */
applyTheme();
window.addEventListener('resize',()=>{ layout(); });
const startTab=store.get('tab','play');
S.tab=['play','openings','puzzles','family'].includes(startTab)?startTab:'play';
if(S.tab==='openings'||S.tab==='puzzles') S.tab='play';
layout();
switchTab(S.tab,true);
const ps=sessions.play;
if(ps.kind==='cpu'&&ps.eng.status()==='ongoing'&&(ps.eng.turn()?'b':'w')!==ps.human) setTimeout(cpuMove,500);
else if(ps.eng.status()!=='ongoing'){ ps.over=resultText(ps.eng.status(),ps.eng.turn()?'b':'w'); renderAll(); }
Fam.init();
if('serviceWorker' in navigator&&location.protocol==='https:'){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
})();

</script>
</body>
